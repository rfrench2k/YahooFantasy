<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Football shape (pointed ellipse/oval) rotated diagonally -->
  <ellipse cx="100" cy="100" rx="55" ry="90" fill="#8b4513" stroke="#654321" stroke-width="3" transform="rotate(-30 100 100)"/>
  
  <!-- Laces/stitching -->
  <g transform="rotate(-30 100 100)">
    <!-- Center line -->
    <line x1="100" y1="60" x2="100" y2="140" stroke="#f5deb3" stroke-width="3"/>
    
    <!-- Horizontal laces -->
    <line x1="82" y1="75" x2="118" y2="75" stroke="#f5deb3" stroke-width="2.5"/>
    <line x1="82" y1="87" x2="118" y2="87" stroke="#f5deb3" stroke-width="2.5"/>
    <line x1="82" y1="100" x2="118" y2="100" stroke="#f5deb3" stroke-width="2.5"/>
    <line x1="82" y1="113" x2="118" y2="113" stroke="#f5deb3" stroke-width="2.5"/>
    <line x1="82" y1="125" x2="118" y2="125" stroke="#f5deb3" stroke-width="2.5"/>
  </g>
</svg>